# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  TeaVision AI — CI/CD Pipeline                                               ║
# ║  BSc Data Science Capstone — NIBM, 2026                                      ║
# ║                                                                               ║
# ║  This workflow runs on every push and PR to main branch:                     ║
# ║  1. Linting (flake8, eslint)                                                 ║
# ║  2. Unit & Integration Tests (pytest)                                        ║
# ║  3. Model Validation (forward pass checks)                                   ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

name: TeaVision CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # Backend Tests (Python)
  # ═══════════════════════════════════════════════════════════════════════════
  backend-tests:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        
      - name: 🐍 Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
      
      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install pytest pytest-cov flake8
      
      - name: 🔍 Lint with flake8
        run: |
          # Stop build on syntax errors or undefined names
          flake8 backend/ --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all errors as warnings (optional strict mode)
          flake8 backend/ --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics
      
      - name: 🧪 Run unit tests
        run: |
          pytest backend/tests/test_teavision.py -v --tb=short -x -k "not test_end_to_end_with_real_sample_image and not test_api_analyze"
        env:
          PYTHONPATH: ${{ github.workspace }}
      
      - name: ✓ Model import validation
        run: |
          python -c "from backend.models.unet import create_model, MODEL_REGISTRY; print(f'✓ Loaded {len(MODEL_REGISTRY)} models')"
          python -c "from backend.models.metrics import DiceLoss, calculate_operational_risk; print('✓ Metrics module OK')"
          python -c "from backend.api.rag_store import query_guidelines; print('✓ RAG store module OK')"
          python -c "from backend.api.agent_graph import run_agent_pipeline; print('✓ Agent graph module OK')"
  
  # ═══════════════════════════════════════════════════════════════════════════
  # Frontend Tests (Node.js)
  # ═══════════════════════════════════════════════════════════════════════════
  frontend-tests:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: frontend
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        
      - name: 📦 Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      
      - name: 📦 Install dependencies
        run: npm ci
      
      - name: 🔍 Lint with ESLint
        run: npm run lint || true  # Allow lint warnings for now
      
      - name: 🏗️ Build production bundle
        run: npm run build
      
      - name: ✓ Verify build output
        run: |
          ls -la dist/
          test -f dist/index.html && echo "✓ index.html exists"

  # ═══════════════════════════════════════════════════════════════════════════
  # Model Validation
  # ═══════════════════════════════════════════════════════════════════════════
  model-validation:
    runs-on: ubuntu-latest
    needs: backend-tests
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        
      - name: 🐍 Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
      
      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install segmentation-models-pytorch timm albumentations
      
      - name: 🔬 Validate segmentation models
        run: |
          python -c "
          import torch
          from backend.models.unet import create_model
          
          for model_name in ['efficientnet_scse', 'resnet34_unet', 'sea_unet']:
              model = create_model(model_name)
              model.eval()
              x = torch.randn(1, 3, 256, 256)
              with torch.no_grad():
                  y = model(x)
              print(f'✓ {model_name}: input {tuple(x.shape)} → output {tuple(y.shape)}')
          "
        env:
          PYTHONPATH: ${{ github.workspace }}
      
      - name: 🔬 Validate classification model
        run: |
          python -c "
          import torch
          from backend.models.unet import create_classifier
          
          classifier = create_classifier()
          classifier.eval()
          x = torch.randn(1, 3, 512, 512)
          with torch.no_grad():
              y = classifier(x)
          print(f'✓ EfficientNet-B4 Classifier: input {tuple(x.shape)} → output {tuple(y.shape)}')
          assert y.shape == (1, 8), f'Expected (1, 8), got {y.shape}'
          "
        env:
          PYTHONPATH: ${{ github.workspace }}

# Render Blueprint - TeaVision AI Hosting
# https://render.com/docs/blueprint-spec
# Deploy: Connect your GitHub repo at https://dashboard.render.com/
# 
# NOTE: Render no longer offers free web services (as of 2024).
# Backend requires at least "Starter" plan (~$7/month) for PyTorch.
# Static sites remain free.

services:
  # Backend API (FastAPI + PyTorch)
  - type: web
    name: teavision-api
    runtime: python
    buildCommand: |
      pip install --upgrade pip
      pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      pip install -r requirements.txt
    startCommand: cd backend && python -m uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.10.0"
      - key: OLLAMA_BASE_URL
        value: "http://localhost:11434"
      - key: FAST_MODE_ENABLED
        value: "True"
    healthCheckPath: /
    autoDeploy: true

  # Frontend (React + Vite - Static Site) - FREE
  - type: static
    name: teavision-frontend
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=31536000
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://teavision-api.onrender.com
